name: Fehlerbericht / Bug report
description: Etwas funktioniert nicht oder FrameBoost stürzt ab
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden! Am schnellsten geht es mit dem eingebauten Bericht:
        **Mac:** Menü *Hilfe → Fehlerbericht erstellen …* · **Windows:** *Einstellungen → Fehlerbericht erstellen*.
        Die Datei `FrameBoost-Fehlerbericht.txt` landet auf dem Schreibtisch – einfach unten anhängen.
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [macOS, Windows]
    validations:
      required: true
  - type: input
    id: card
    attributes:
      label: Capture Card
      placeholder: z. B. UGREEN 4K Capture (MS2130), Elgato HD60 X
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
      description: Was hast du gemacht, was hast du erwartet, was ist stattdessen passiert?
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Fehlerbericht-Datei
      description: FrameBoost-Fehlerbericht.txt hier hineinziehen
