name: Build macOS DMG
on:
  push:
    branches: [main]
    paths: ['Sources/**', 'scripts/**', 'Package.swift', '.github/workflows/build.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
# a newer push cancels an older run, so an old build can never overwrite the download
concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Optional: Apple Developer ID signing + notarization (only runs when the secrets exist, see SIGNIEREN.md)
      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC=$RUNNER_TEMP/sign.keychain-db
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "SIGN_IDENTITY=$ID" >> $GITHUB_ENV
          rm $RUNNER_TEMP/cert.p12
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build app + DMG
        env:
          VERSION: "2.4.0"
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./scripts/build_dmg.sh
      - name: Self test (real GPU pipeline)
        run: |
          set -o pipefail
          mkdir -p ci-output
          ./build/FrameBoost.app/Contents/MacOS/FrameBoost --selftest ci-output 2>&1 | tee ci-output/selftest-log.txt
      - name: Apple Silicon check (universal binary)
        if: always()
        run: |
          mkdir -p ci-output
          {
            echo "Mac des Testservers: $(sysctl -n machdep.cpu.brand_string) · $(uname -m)"
            echo "App-Datei: $(lipo -info build/FrameBoost.app/Contents/MacOS/FrameBoost)"
            echo "Läuft gerade als: $(file build/FrameBoost.app/Contents/MacOS/FrameBoost | tr '\n' ' ')"
          } | tee ci-output/architektur.txt
      - name: 30 FPS test video (from the 60 FPS original)
        if: always()
        run: |
          brew install ffmpeg >/dev/null
          if curl -L --fail --silent --max-time 600 -o bbb60.zip https://download.blender.org/demo/movies/BBB/bbb_sunflower_1080p_60fps_normal.mp4.zip && unzip -o -q bbb60.zip; then
            SRC=$(ls bbb_sunflower_1080p_60fps_normal*.mp4 | head -1)
            # 20 s of the film at 60 FPS = the truth; every second frame of it = the 30 FPS "game"
            ffmpeg -loglevel error -y -ss 62 -t 20 -i "$SRC" -r 60 -c:v libx264 -preset veryfast -crf 12 -pix_fmt yuv420p -c:a aac ref_60fps.mp4
            echo "Testvideo: Big Buck Bunny (Blender Foundation, CC BY 3.0), 1080p, Original 60 FPS" > ci-output/testvideo.txt
          else
            ffmpeg -loglevel error -y -f lavfi -i testsrc2=size=1920x1080:rate=60 -t 20 -c:v libx264 -preset veryfast -crf 12 -pix_fmt yuv420p ref_60fps.mp4
            echo "Testvideo: ffmpeg testsrc2 (Download nicht möglich), 1080p, 60 FPS" > ci-output/testvideo.txt
          fi
          ffmpeg -loglevel error -y -i ref_60fps.mp4 -vf "select='not(mod(n\,2))',setpts=N/(30*TB)" -r 30 -c:v libx264 -preset veryfast -crf 12 -pix_fmt yuv420p -c:a copy testvideo_30fps.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_frames -of csv=p=0 testvideo_30fps.mp4 | sed 's/^/30-FPS-Version: /' | tee -a ci-output/testvideo.txt
      - name: Video test – 30 FPS video as capture card, lock to 60 FPS
        if: always()
        timeout-minutes: 6
        run: |
          set +e
          ./build/FrameBoost.app/Contents/MacOS/FrameBoost --videotest "$PWD/testvideo_30fps.mp4" --soak-dir "$PWD/ci-output" --seconds 40 > ci-output/videotest-stdout.txt 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            sleep 2
            [ $i -eq 15 ] && screencapture -x ci-output/videotest.png
            kill -0 $PID 2>/dev/null || break
          done
          if kill -0 $PID 2>/dev/null; then sample $PID 5 -file ci-output/videotest_haenger_stack.txt; kill -9 $PID; fi
          wait $PID; CODE=$?
          cat ci-output/videotest-report.txt
          exit $CODE
      - name: Before/after video + quality against the real 60 FPS frames
        if: always()
        run: |
          FB=./build/FrameBoost.app/Contents/MacOS/FrameBoost
          $FB --render60 "$PWD/testvideo_30fps.mp4" "$PWD/frameboost_60fps.mp4" --seconds 20
          $FB --render60 "$PWD/testvideo_30fps.mp4" "$PWD/l_fb.mp4" --seconds 20 --label "FrameBoost 60 FPS"
          $FB --render60 "$PWD/testvideo_30fps.mp4" "$PWD/l_orig.mp4" --seconds 20 --hold --label "Original 30 FPS"
          ffmpeg -loglevel error -y -i l_orig.mp4 -i l_fb.mp4 -filter_complex "[0:v]scale=960:-2[a];[1:v]scale=960:-2[b];[a][b]hstack" \
            -r 60 -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p -movflags +faststart ci-output/vergleich_30_vs_60fps.mp4
          # other ways to get 60 FPS out of the same 30 FPS video (first 10 s)
          ffmpeg -loglevel error -y -t 10 -i testvideo_30fps.mp4 -vf fps=60 -c:v libx264 -crf 12 -preset veryfast hold60.mp4
          ffmpeg -loglevel error -y -t 10 -i testvideo_30fps.mp4 -vf "minterpolate=fps=60:mi_mode=blend" -c:v libx264 -crf 12 -preset veryfast blend60.mp4
          ffmpeg -loglevel error -y -t 10 -i testvideo_30fps.mp4 -vf "minterpolate=fps=60:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:vsbmc=1" -c:v libx264 -crf 12 -preset veryfast mci60.mp4
          # compare only the in-between frames (odd frame numbers) with the real frames of the 60 FPS original
          q() {
            ffmpeg -t 10 -i "$1" -t 10 -i ref_60fps.mp4 -lavfi "[0:v]select='mod(n\,2)',setpts=N/TB[a];[1:v]select='mod(n\,2)',setpts=N/TB[b];[a][b]psnr;[0:v]select='mod(n\,2)',setpts=N/TB[c];[1:v]select='mod(n\,2)',setpts=N/TB[d];[c][d]ssim" -f null - 2>&1 \
              | grep -oE "(PSNR.*average:[0-9.inf]+|SSIM.*All:[0-9.]+)" | sed -E 's/.*average:/PSNR /; s/.*All:/SSIM /' | tr '\n' ' '
          }
          {
            echo "Qualität der Zwischenbilder gegen die ECHTEN Bilder des 60-FPS-Originals (10 s Big Buck Bunny, höher = besser)"
            echo "Bild wiederholen (normales 30 FPS): $(q hold60.mp4)"
            echo "Überblenden:                        $(q blend60.mp4)"
            echo "FFmpeg Motion Interpolation (MCI):  $(q mci60.mp4)"
            echo "FrameBoost:                         $(q frameboost_60fps.mp4)"
          } | tee ci-output/qualitaet_echtes_video.txt
          ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate,nb_frames -of csv=p=0 frameboost_60fps.mp4 | tee ci-output/frameboost_60fps_info.txt
      - name: App screenshots
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-output
          ./build/FrameBoost.app/Contents/MacOS/FrameBoost &
          PID=$!
          sleep 6
          screencapture -x ci-output/app_startbildschirm.png || true
          kill $PID || true
          sleep 2
          ./build/FrameBoost.app/Contents/MacOS/FrameBoost --demo &
          PID=$!
          sleep 8
          screencapture -x ci-output/app_screenshot.png || true
          kill $PID || true
      - name: Soak test (10 min, every feature, memory + crash check)
        if: always()
        timeout-minutes: 18
        run: |
          set +e
          mkdir -p ci-output
          ./build/FrameBoost.app/Contents/MacOS/FrameBoost --soak 600 --soak-dir "$PWD/ci-output" > ci-output/soak-stdout.txt 2>&1 &
          PID=$!
          RESULT="hängt"
          for i in $(seq 1 180); do
            sleep 5
            [ $i -eq 60 ] && screencapture -x ci-output/soak_5min.png
            if ! kill -0 $PID 2>/dev/null; then
              wait $PID; CODE=$?
              RESULT="beendet (exit code $CODE)"
              break
            fi
          done
          if kill -0 $PID 2>/dev/null; then
            screencapture -x ci-output/soak_haenger.png
            sample $PID 5 -file ci-output/soak_haenger_stack.txt || true
            kill -9 $PID
            CODE=99
          fi
          echo "Dauertest: $RESULT" | tee -a ci-output/soak-stdout.txt
          cp ~/Library/Logs/FrameBoost/frameboost.log ci-output/ 2>/dev/null || true
          cp ~/Library/Logs/FrameBoost/last-crash.txt ci-output/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/FrameBoost* ci-output/ 2>/dev/null || true
          exit $CODE
      - name: Installer window screenshot
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-output
          hdiutil attach build/FrameBoost.dmg -noautoopen
          sleep 3
          osascript -e 'tell application "Finder"' -e 'activate' -e 'open disk "FrameBoost"' -e 'end tell' || open /Volumes/FrameBoost
          sleep 12
          screencapture -x ci-output/dmg_installer.png || true
          osascript -e 'tell application "Finder" to close every window' || true
          sleep 2
          osascript -e 'tell application "Finder"' -e 'open disk "FrameBoost"' -e 'end tell' || true
          sleep 10
          screencapture -x ci-output/dmg_installer2.png || true
          hdiutil detach /Volumes/FrameBoost -force || true
      - name: Publish results to ci-output branch
        if: always()
        run: |
          mkdir -p ci-output; cp build/FrameBoost.dmg ci-output/ || true
          cd ci-output
          git init -q && git checkout -q -b ci-output
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "CI output ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-output
      - name: Development build (every push to main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Entwicklungsversion (automatisch gebaut)
          prerelease: true
          make_latest: false
          files: build/FrameBoost.dmg
      - name: Official release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FrameBoost ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: build/FrameBoost.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: FrameBoost-dmg
          path: build/FrameBoost.dmg
