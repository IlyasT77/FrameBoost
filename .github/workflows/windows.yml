name: Build Windows EXE
on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
# a newer push cancels an older run, so an old build can never overwrite the download
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: App icon
        run: python make_icon.py
      - name: Self test (source)
        run: python main.py --selftest ci-win
      - name: Build FrameBoost.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name FrameBoost --icon icon.ico --add-data "icon.ico;." `
            --collect-data sounddevice --hidden-import pygrabber.dshow_graph `
            --exclude-module tkinter --exclude-module matplotlib main.py
          Get-Item dist\FrameBoost.exe | Select-Object Name, Length
      - name: Self test (EXE)
        run: |
          $p = Start-Process -FilePath dist\FrameBoost.exe -ArgumentList '--selftest', "$PWD\ci-win\exe" -Wait -PassThru
          Get-Content ci-win\exe\ergebnis.txt
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen ($($p.ExitCode))" }
      - name: Screenshots (EXE)
        if: always()
        env:
          FB_RASTER: '1'
        run: |
          Start-Process -FilePath dist\FrameBoost.exe -ArgumentList '--screenshot-idle', "$PWD\ci-win\app_start.png" -Wait
          Start-Process -FilePath dist\FrameBoost.exe -ArgumentList '--screenshot', "$PWD\ci-win\app_demo.png" -Wait
      - name: Soak test (5 min, every feature)
        if: always()
        timeout-minutes: 9
        env:
          FB_RASTER: '1'
        run: |
          $p = Start-Process -FilePath dist\FrameBoost.exe -ArgumentList '--soak', '300', "$PWD\ci-win\soak" -Wait -PassThru
          "exit code: $($p.ExitCode)" | Out-File ci-win\soak\exitcode.txt
          Copy-Item "$env:LOCALAPPDATA\FrameBoost\*" ci-win\soak\ -ErrorAction SilentlyContinue
          Get-Content ci-win\soak\soak-report.txt
          if ($p.ExitCode -ne 0) { throw "Dauertest fehlgeschlagen ($($p.ExitCode))" }
      - name: Publish results to ci-output-win branch
        if: always()
        run: |
          Copy-Item dist\FrameBoost.exe ci-win\ -ErrorAction SilentlyContinue
          cd ci-win
          git init -q; git checkout -q -b ci-output-win
          git add -A; git -c user.name=ci -c user.email=ci@localhost commit -qm "CI output $env:GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$env:GITHUB_REPOSITORY.git" ci-output-win
      - name: Release (download link)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: windows/dist/FrameBoost.exe
      - uses: actions/upload-artifact@v4
        with:
          name: FrameBoost-exe
          path: windows/dist/FrameBoost.exe
