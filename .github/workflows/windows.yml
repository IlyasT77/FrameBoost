name: Build Windows EXE
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version, z. B. v2.4.0 (leer = nur bauen)'
        required: false
        default: ''
permissions:
  contents: write
# runs of a branch wait for each other in order instead of cancelling each other:
# no "cancelled" mails, and an older build can never overwrite a newer download
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          New-Item -ItemType Directory -Force ci-win | Out-Null
      - name: App icon
        run: python make_icon.py
      - name: Self test (source)
        run: python main.py --selftest ci-win
      - name: Build FrameBoost.exe
        run: |
          pyinstaller --noconfirm FrameBoost.spec
          $mb = [math]::Round((Get-Item dist\FrameBoost.exe).Length / 1MB, 1)
          "FrameBoost.exe: $mb MB" | Tee-Object -FilePath ci-win\exe-groesse.txt
      - name: Self test (EXE)
        run: |
          $p = Start-Process -FilePath dist\FrameBoost.exe -ArgumentList '--selftest', "$PWD\ci-win\exe" -Wait -PassThru
          Get-Content ci-win\exe\ergebnis.txt
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen ($($p.ExitCode))" }
      - name: Screenshots (EXE)
        if: always()
        env:
          FB_RASTER: '1'
        run: |
          Start-Process -FilePath dist\FrameBoost.exe -ArgumentList '--screenshot-idle', "$PWD\ci-win\app_start.png" -Wait
          Start-Process -FilePath dist\FrameBoost.exe -ArgumentList '--screenshot', "$PWD\ci-win\app_demo.png" -Wait
      - name: Video test – 30 FPS video as capture card (source, same code as the EXE)
        if: always()
        timeout-minutes: 8
        env:
          FB_RASTER: '1'
        run: |
          curl.exe -L --fail --silent --max-time 600 -o bbb30.zip https://download.blender.org/demo/movies/BBB/bbb_sunflower_1080p_30fps_normal.mp4.zip
          Expand-Archive -Force bbb30.zip -DestinationPath bbb
          $video = (Get-ChildItem bbb -Recurse -Filter *.mp4 | Select-Object -First 1).FullName
          "Testvideo: $video" | Out-File ci-win\testvideo.txt
          python main.py --videotest "$video" --soak-dir "$PWD\ci-win\videotest" --seconds 30 --video-start 62
          Get-Content ci-win\videotest\videotest-report.txt
      - name: Soak test (5 min, every feature)
        if: always()
        timeout-minutes: 9
        env:
          FB_RASTER: '1'
        run: |
          $p = Start-Process -FilePath dist\FrameBoost.exe -ArgumentList '--soak', '300', "$PWD\ci-win\soak" -Wait -PassThru
          "exit code: $($p.ExitCode)" | Out-File ci-win\soak\exitcode.txt
          Copy-Item "$env:LOCALAPPDATA\FrameBoost\*" ci-win\soak\ -ErrorAction SilentlyContinue
          Get-Content ci-win\soak\soak-report.txt
          if ($p.ExitCode -ne 0) { throw "Dauertest fehlgeschlagen ($($p.ExitCode))" }
      - name: Publish results to ci-output-win branch
        if: always()
        run: |
          Copy-Item dist\FrameBoost.exe ci-win\ -ErrorAction SilentlyContinue
          cd ci-win
          git init -q; git checkout -q -b ci-output-win
          git add -A; git -c user.name=ci -c user.email=ci@localhost commit -qm "CI output $env:GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$env:GITHUB_REPOSITORY.git" ci-output-win
      - name: Development build (every push to main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Entwicklungsversion (automatisch gebaut)
          prerelease: true
          make_latest: false
          files: windows/dist/FrameBoost.exe
      - name: Official release (tag v*, or started by hand with a version)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: FrameBoost ${{ github.event.inputs.version || github.ref_name }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: windows/dist/FrameBoost.exe
      - uses: actions/upload-artifact@v6
        with:
          name: FrameBoost-exe
          path: windows/dist/FrameBoost.exe
